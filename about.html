<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us - Fatin's Florette</title>
    
    <style>
        /* Basic reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* The Navbar */
        header {
            background-color: #6b1c3e;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
        }

        header .logo img {
            height: 40px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 12px;
            letter-spacing: 1px;
        }

        /* The Main About Us Section */
        .about-container {
            background-color: #f4dede; /* Light pink */
            padding: 60px 40px;
            min-height: 80vh; /* Keeps the footer at the bottom */
        }

        /* Top part: The overlapping images on the right */
        .image-cluster {
            display: flex;
            justify-content: flex-end; /* Pushes images to the right */
            gap: 15px; /* Space between the two images */
            margin-bottom: 80px; /* Space below the images */
        }

        .image-cluster img {
            width: 250px;
            height: 300px;
            object-fit: cover;
            border: 5px solid white; /* Optional: adds a nice frame */
        }

        /* Bottom part: Founder section */
        .founder-section {
            display: flex;
            flex-direction: column;
            align-items: center; /* Centers the text and image */
            text-align: center;
        }

        .founder-section h3 {
            font-size: 16px;
            font-weight: normal;
            margin-bottom: 20px;
            color: #333;
        }

        .founder-section img {
            width: 250px;
            border-radius: 5px;
        }

        /* The Footer */
        footer {
            background-color: #d1c2c4;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #555;
        }

        .footer-icons img {
            width: 24px;
            height: 24px;
            margin-right: 15px;
            cursor: pointer;
        }

        .footer-map img {
            width: 100px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <!-- 1. Header / Navigation -->
    <header>
        <div class="logo">
            <img src="logo.png" alt="Fatin's Florette Logo">
        </div>
        <nav>
            <a href="index.html">HOME</a>
            <a href="about.html">ABOUT US</a>
            <a href="#">CATALOG</a>
            <a href="#">OCCASION</a>
            <a href="#">SUBSCRIPTION</a>
            <a href="#">CONTACT US</a>
            <a href="#">🛒</a>
        </nav>
    </header>

    <!-- 2. About Us Content -->
    <section class="about-container">
        
        <!-- Top Images (Replace src with your actual file names) -->
        <div class="image-cluster">
            <img src="studio1.png" alt="Shop Interior">
            <img src="studio.png" alt="Flower Decorations">
        </div>

        <!-- Founder Section -->
        <div class="founder-section">
            <h3>The Founder of Fatin's Florette</h3>
            <img src="founder.png" alt="The Founder">
        </div>

    </section>

    <!-- 3. Footer -->
    <footer>
        <div class="footer-icons">
            <a href="#"><img src="ig.png" alt="Instagram"></a>
            <a href="#"><img src="tt.png" alt="TikTok"></a>
            <a href="#"><img src="wa.png" alt="WhatsApp"></a>
        </div>
        <div class="footer-map">
            <img src="map.png" alt="Location Map">
        </div>
    </footer>

</body>
</html>
