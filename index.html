<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fatin's Florette</title>
    
    <!-- This is the CSS (the styling) -->
    <style>
        /* Basic reset to remove default browser spacing */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* The Navbar (Top Menu) */
        header {
            background-color: #6b1c3e; /* The maroon color from your design */
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
        }

        header .logo {
            font-size: 20px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 12px;
            letter-spacing: 1px;
        }

        /* The Hero Section (Big Banner Image) */
        .hero {
            /* THIS IS WHERE YOU PUT YOUR IMAGE NAME */
            background-image: url('header.png'); 
            background-size: cover;
            background-position: center;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero button {
            background-color: rgba(255, 255, 255, 0.7);
            color: #333;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 1px;
        }

        /* The Main Content Area (Pink background) */
        .main-content {
            background-color: #f4dede; /* The light pink background */
            height: 300px; /* Just a placeholder height for now */
        }

        /* The Footer (Bottom grey section) */
        footer {
            background-color: #d1c2c4;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #555;
        }

        .footer-icons img {
            width: 24px; /* Makes the icons small and neat */
            height: 24px;
            margin-right: 15px; /* Puts space between them */
            cursor: pointer;
        }

        .footer-map img {
            width: 100px; /* Small map icon */
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <!-- 1. Header / Navigation -->
    <header>
        <div class="logo">
            <!-- This is your logo image -->
            <img src="logo.png" alt="Fatin's Florette Logo" style="height: 40px;">
        </div>
        
        <!-- Fixed: Removed the extra </div> and <nav> here -->
        <nav>
            <a href="index.html">HOME</a>
            <a href="about.html">ABOUT US</a>
            <a href="#">CATALOG</a>
            <a href="#">OCCASION</a>
            <a href="#">SUBSCRIPTION</a>
            <a href="#">CONTACT US</a>
            <a href="#">🛒</a>
        </nav>
    </header>

    <!-- 2. Hero Banner -->
    <!-- Note: The image is added via CSS above, you don't need to add it here in the HTML -->
    <section class="hero">
        <button>SHOP NOW</button>
    </section>

    <!-- 3. Main Content Area (Empty for now, we will add items later) -->
    <section class="main-content">
        <!-- We will put your products here later -->
    </section>

    <!-- 4. Footer -->
        <footer>
        <div class="footer-icons">
            <a href="#"><img src="ig.png" alt="Instagram"></a>
            <a href="#"><img src="tt.png" alt="TikTok"></a>
            <a href="#"><img src="wa.png" alt="WhatsApp"></a>
       
        </div>
        <div class="footer-map">
            <!-- Placeholder for your map image -->
            <img src="map.png" alt="Location Map">
        </div>
    </footer>

</body>
</html>
